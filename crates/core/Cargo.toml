[package]
name = "jsoncv_core"
version = "0.1.0"
edition = "2021"

[dependencies]
jsonschema = { version = "0.61", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
directories = "6"
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }
sha2 = "0.11"
fd-lock = "4"
similar = "2"
json-patch = "5"

[dev-dependencies]
tempfile = "3"
