[package]
name = "jsoncv_core"
version = "0.1.0"
edition = "2021"

[dependencies]
jsonschema = { version = "0.61", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
directories = "6"
rusqlite = { version = "0.43", features = ["bundled"] }
sha2 = "0.11"
similar = "2"
json-patch = "5"
regex = "1"
base64 = "0.23"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
minijinja = { version = "3", features = ["serde", "preserve_order"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs"] }
chromiumoxide = { version = "0.9", default-features = false }
futures-util = "0.3"
tempfile = "3"
trash = "5"
